<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academia Brother Gil - Personal Trainer Virtual</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">

            <div class="logo">
                <div class="logo-icon">🏋️</div>

                <div>
                    <h1>FitAI</h1>
                    <span>Seu Personal Trainer Virtual</span>
                </div>
            </div>

            <button id="novaConversa">
                + Nova Conversa
            </button>

        </header>


        <main class="chat-container">

            <div id="mensagens" class="mensagens">

                <div class="mensagem ia">
                    <div class="avatar">🤖</div>

                    <div class="conteudo">
                        Olá! 👋 Sou o Gilmar, seu personal trainer virtual.

                        Posso ajudar com exercícios, treinos e motivação.
                        Como posso ajudar você hoje? 💪
                    </div>
                </div>

            </div>

        </main>


        <div class="input-area">

            <input
                type="text"
                id="mensagemInput"
                placeholder="Digite sua mensagem..."
            >

            <button id="enviar">
                Enviar ➤
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
