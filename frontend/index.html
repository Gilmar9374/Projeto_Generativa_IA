<!DOCTYPE html>
<html <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
      <title>Academia Brother Gil - Personal Trainer Virtual</title>
  
      <!-- Markdown -->
      <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
      <link rel="stylesheet" href="style.css">
  </head>
  
  <body>
  
      <div class="app">
  
          <!-- CABEÇALHO -->
          <header class="header">
  
              <div class="logo">
  
                  <div class="logo-icon">
                      🏋️
                  </div>
  
                  <div>
                      <h1>Academia Brother Gil</h1>
                      <span>Seu Personal Trainer Virtual</span>
                  </div>
  
              </div>
  
              <div class="header-actions">
  
                  <span id="contador">
                      Mensagens: 0
                  </span>
  
                  <button
                      id="tema"
                      type="button"
                      title="Alternar tema"
                  >
                      🌙
                  </button>
  
                  <button
                      id="novaConversa"
                      type="button"
                  >
                      + Nova Conversa
                  </button>
  
              </div>
  
          </header>
  
  
          <!-- CHAT -->
          <main class="chat-container">
  
              <div
                  id="mensagens"
                  class="mensagens"
              >
  
                  <!-- As mensagens serão inseridas pelo JavaScript -->
  
              </div>
  
          </main>
  
  
          <!-- INPUT -->
          <form
              id="formulario"
              class="input-area"
          >
  
              <input
                  type="text"
                  id="mensagemInput"
                  placeholder="Digite sua mensagem..."
                  autocomplete="off"
                  maxlength="2000"
                  required
              >
  
              <button
                  type="submit"
                  id="enviar"
              >
                  Enviar ➤
              </button>
  
          </form>
  
      </div>
  
  
      <script src="script.js"></script>
  
  </body>
  </html>
